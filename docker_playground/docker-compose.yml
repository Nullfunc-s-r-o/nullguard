services:
  nullguard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: nullguard_test
    pid: "host"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/proc:ro
      - /sys:/sys:ro
      # Mount the mock log file directly into the container
      - ./mock_syslog.log:/var/log/mock_syslog.log:ro
      # Mount the test configuration
      - ./config.yaml:/app/config.yaml
      - nullguard_test_data:/app/data
    environment:
      # Optional: Add your key if you want to test the AI RCA!
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    restart: unless-stopped

volumes:
  nullguard_test_data:
